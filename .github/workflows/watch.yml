name: Watch tsf.org.tr

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum cadence
  workflow_dispatch:

# Only one watcher at a time. A newly scheduled run waits for the running one
# to finish, so with a ~9.5 minute loop per run coverage is continuous.
concurrency:
  group: tsf-watch
  cancel-in-progress: false

permissions:
  contents: write   # commit page snapshots to state/
  actions: write    # /stop disables this workflow and cancels queued runs

env:
  # Public repo: loop inside each run, checking every POLL_SECONDS (free, near-realtime).
  # Private repo: one check per run, because private repos are billed per minute.
  LOOP_SECONDS: ${{ github.event.repository.private && '0' || '570' }}
  POLL_SECONDS: "30"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - name: Restore subscriber list and runtime
        uses: actions/cache/restore@v6
        with:
          path: |
            state/chats.json
            state/runtime.json
          key: watch-${{ github.run_id }}
          restore-keys: |
            watch-
            chats-

      - name: Install the Anthropic SDK (only when an API key is configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python3 -m pip install -q --disable-pip-version-check anthropic
          else
            echo "ANTHROPIC_API_KEY not set; AI summaries off"
          fi

      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: watch.yml
        run: |
          git config user.name "chesstrack-bot"
          git config user.email "chesstrack-bot@users.noreply.github.com"
          start=$SECONDS
          while :; do
            rc=0
            python3 watcher/watch.py || rc=$?
            git add state
            if ! git diff --cached --quiet; then
              git commit -q -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3; do
                git push -q && break
                git pull -q --rebase && sleep 2
              done
            fi
            if [ "$rc" -eq 3 ]; then
              echo "::notice::stopped via /stop"
              break
            fi
            [ "$rc" -ne 0 ] && echo "::warning::check exited with $rc"
            elapsed=$((SECONDS - start))
            [ "$elapsed" -ge "$LOOP_SECONDS" ] && break
            sleep "$POLL_SECONDS"
          done

      - name: Save subscriber list and runtime
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            state/chats.json
            state/runtime.json
          key: watch-${{ github.run_id }}
