name: Watch tsf.org.tr

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum cadence
  workflow_dispatch:

# Only one watcher at a time. A newly scheduled run waits for the running one
# to finish, so with a ~9.5 minute loop per run coverage is continuous.
concurrency:
  group: tsf-watch
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Public repo: loop inside each run, checking every POLL_SECONDS (near-realtime, free).
  # Private repo: one check per run, because private repos have only 2000 free minutes/month.
  LOOP_SECONDS: ${{ github.event.repository.private && '0' || '570' }}
  POLL_SECONDS: "40"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - name: Restore subscriber list
        uses: actions/cache/restore@v4
        with:
          path: state/chats.json
          key: chats-${{ github.run_id }}
          restore-keys: chats-

      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "chesstrack-bot"
          git config user.email "chesstrack-bot@users.noreply.github.com"
          start=$SECONDS
          while :; do
            python3 watcher/watch.py || echo "::warning::check failed"
            git add state
            if ! git diff --cached --quiet; then
              git commit -q -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3; do
                git push -q && break
                git pull -q --rebase && sleep 2
              done
            fi
            elapsed=$((SECONDS - start))
            [ "$elapsed" -ge "$LOOP_SECONDS" ] && break
            sleep "$POLL_SECONDS"
          done

      - name: Save subscriber list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/chats.json
          key: chats-${{ github.run_id }}
