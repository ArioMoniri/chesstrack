name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["watcher/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -q --disable-pip-version-check ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
