[project]
name = "chesstrack"
version = "0.1.0"
description = "Watches tsf.org.tr and reports changes to a Telegram bot"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
